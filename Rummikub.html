<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온라인 루미큐브</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b3e50; color: #fff; padding: 20px; }
    #lobby, #game { max-width: 1000px; margin: 0 auto; }
    .card { background: #34495e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1, h2 { margin-bottom: 15px; }
    input, button { padding: 10px 16px; font-size: 16px; border-radius: 6px; border: none; outline: none; margin-right: 8px; margin-bottom: 8px; }
    input { background: #ecf0f1; color: #2c3e50; }
    button { background: #3498db; color: white; cursor: pointer; transition: 0.2s; font-weight: bold; }
    button:hover { background: #2980b9; }
    button:disabled { background: #7f8c8d; cursor: not-allowed; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #1abc9c; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; color: #2c3e50; font-weight: bold; }
    
    .board-zone, .hand-zone { background: #1e2b37; min-height: 180px; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 2px dashed #4a6572; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
    
    .tile { width: 44px; height: 60px; background: #fdfefe; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; box-shadow: 0 3px 5px rgba(0,0,0,0.4); user-select: none; cursor: pointer; border: 2px solid #bdc3c7; position: relative; }
    .tile.selected { border: 3px solid #f1c40f; transform: translateY(-4px); }
    .tile.black { color: #2c3e50; }
    .tile.red { color: #e74c3c; }
    .tile.blue { color: #2980b9; }
    .tile.yellow { color: #f39c12; }
    .tile.joker { color: #8e44ad; font-size: 14px; }
    
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-action { background: #e67e22; }
    .btn-action:hover { background: #d35400; }
    .btn-end { background: #2ecc71; }
    .btn-end:hover { background: #27ae60; }
  </style>
</head>
<body>

  <div id="lobby" class="card">
    <h1>🎲 실시간 루미큐브</h1>
    <div style="margin-bottom: 20px;">
      <h3>1. 방 만들기 (방장)</h3>
      <button id="btn-create">새 게임 방 생성</button>
      <p id="room-id-display" style="margin-top: 8px; font-weight: bold; color: #f1c40f;"></p>
    </div>
    <hr style="border: 0.5px solid #4a6572; margin: 20px 0;">
    <div>
      <h3>2. 방 참가하기 (친구)</h3>
      <input type="text" id="input-room-id" placeholder="방 코드(Peer ID) 입력" />
      <button id="btn-join">접속하기</button>
    </div>
  </div>

  <div id="game" style="display: none;">
    <div class="status-bar">
      <div>내 역할: <span id="role-text">-</span> | 현재 턴: <span id="turn-text">방장</span></div>
      <div>남은 타일: <span id="deck-count">0</span>개</div>
    </div>

    <h2>보드판 (공용 영역)</h2>
    <div id="board" class="board-zone"></div>

    <h2>내 타일 랙</h2>
    <div id="hand" class="hand-zone"></div>

    <div class="controls card">
      <button id="btn-draw" class="btn-action">타일 1개 가져오기 (턴 종료)</button>
      <button id="btn-place" class="btn-action">선택한 타일 보드로내기</button>
      <button id="btn-pass" class="btn-end">턴 넘기기</button>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let isHost = false;
    let myId = '';
    
    // 게임 상태
    let gameState = {
      deck: [],
      board: [], // [{ id, color, number }]
      players: {}, // { peerId: [tiles] }
      turnOrder: [],
      currentTurnIdx: 0
    };

    let selectedHandIndices = [];

    const colors = ['red', 'blue', 'yellow', 'black'];

    // 타일 덱 생성 (1~13 각 2세트 + 조커 2개)
    function createDeck() {
      const deck = [];
      let idCounter = 1;
      colors.forEach(color => {
        for (let i = 1; i <= 13; i++) {
          deck.push({ id: idCounter++, color, number: i });
          deck.push({ id: idCounter++, color, number: i });
        }
      });
      deck.push({ id: idCounter++, color: 'joker', number: 'J' });
      deck.push({ id: idCounter++, color: 'joker', number: 'J' });
      
      // 셔플
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // 방 만들기 (Host)
    document.getElementById('btn-create').addEventListener('click', () => {
      peer = new Peer();
      peer.on('open', (id) => {
        myId = id;
        isHost = true;
        document.getElementById('room-id-display').innerText = `방 코드: ${id} (이 코드를 친구에게 전달하세요)`;
        document.getElementById('role-text').innerText = '방장';
        initHostGame();
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    });

    // 참가하기 (Client)
    document.getElementById('btn-join').addEventListener('click', () => {
      const targetId = document.getElementById('input-room-id').value.trim();
      if (!targetId) return alert('방 코드를 입력하세요.');

      peer = new Peer();
      peer.on('open', (id) => {
        myId = id;
        isHost = false;
        document.getElementById('role-text').innerText = '참가자';
        conn = peer.connect(targetId);
        setupConnection();
      });
    });

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';

        if (isHost) {
          // 호스트가 게임 시작 상태 전달
          gameState.turnOrder = [myId, conn.peer];
          // 각자 14개씩 타일 배분
          gameState.players[myId] = gameState.deck.splice(0, 14);
          gameState.players[conn.peer] = gameState.deck.splice(0, 14);
          broadcastState();
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'SYNC') {
          gameState = data.state;
          render();
        }
      });
    }

    function initHostGame() {
      gameState.deck = createDeck();
    }

    function broadcastState() {
      render();
      if (conn && conn.open) {
        conn.send({ type: 'SYNC', state: gameState });
      }
    }

    function isMyTurn() {
      return gameState.turnOrder[gameState.currentTurnIdx] === myId;
    }

    // 렌더링
    function render() {
      const turnPeerId = gameState.turnOrder[gameState.currentTurnIdx];
      document.getElementById('turn-text').innerText = turnPeerId === myId ? '내 턴 🟢' : '상대방 턴 🔴';
      document.getElementById('deck-count').innerText = gameState.deck.length;

      // 보드 렌더링
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      gameState.board.forEach(tile => {
        const el = createTileEl(tile);
        boardEl.appendChild(el);
      });

      // 손패 렌더링
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      const myTiles = gameState.players[myId] || [];
      myTiles.forEach((tile, idx) => {
        const el = createTileEl(tile);
        if (selectedHandIndices.includes(idx)) {
          el.classList.add('selected');
        }
        el.addEventListener('click', () => {
          if (!isMyTurn()) return;
          if (selectedHandIndices.includes(idx)) {
            selectedHandIndices = selectedHandIndices.filter(i => i !== idx);
          } else {
            selectedHandIndices.push(idx);
          }
          render();
        });
        handEl.appendChild(el);
      });

      // 버튼 활성화 조절
      const myTurn = isMyTurn();
      document.getElementById('btn-draw').disabled = !myTurn;
      document.getElementById('btn-place').disabled = !myTurn || selectedHandIndices.length === 0;
      document.getElementById('btn-pass').disabled = !myTurn;
    }

    function createTileEl(tile) {
      const div = document.createElement('div');
      div.className = `tile ${tile.color}`;
      div.innerText = tile.number;
      return div;
    }

    // 타일 가져오기 (Draw)
    document.getElementById('btn-draw').addEventListener('click', () => {
      if (!isMyTurn() || gameState.deck.length === 0) return;
      const drawn = gameState.deck.pop();
      gameState.players[myId].push(drawn);
      endTurn();
    });

    // 선택한 타일 보드로 내기
    document.getElementById('btn-place').addEventListener('click', () => {
      if (!isMyTurn() || selectedHandIndices.length === 0) return;
      
      // 인덱스 내림차순 정렬 후 제거
      selectedHandIndices.sort((a, b) => b - a);
      selectedHandIndices.forEach(idx => {
        const tile = gameState.players[myId].splice(idx, 1)[0];
        gameState.board.push(tile);
      });

      selectedHandIndices = [];
      broadcastState();
    });

    // 턴 넘기기
    document.getElementById('btn-pass').addEventListener('click', () => {
      if (!isMyTurn()) return;
      endTurn();
    });

    function endTurn() {
      selectedHandIndices = [];
      gameState.currentTurnIdx = (gameState.currentTurnIdx + 1) % gameState.turnOrder.length;
      broadcastState();
    }
  </script>
</body>
</html>
